spring.application.name=stock-candle-server
server.port=8080

# Cassandra configurations
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042
spring.cassandra.keyspace-name=stock_keyspace
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=none

# Show SQL/CQL logs if required (optional)
# logging.level.org.springframework.data.cassandra=DEBUG
logging.level.com.tradeflow.server=INFO
